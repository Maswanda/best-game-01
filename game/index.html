<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Drift — a lantern arcade game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #070a1a;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #fallback {
    display: none; color: #cfe6ff; text-align: center;
    padding: 20vh 20px 0; font-size: 18px; line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="fallback">Lumen Drift needs JavaScript and the HTML canvas to play.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
